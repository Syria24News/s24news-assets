# مهمة مؤقتة لمرة واحدة — تُحذف فور نجاحها
# الغرض: إلغاء نشر GitHub Pages العالق «قيد التنفيذ» (ca70cdf) الذي يرفض بسببه كل نشر جديد.
# لا تطلب بناءً جديداً (قاعدة ROADMAP): الالتزام الذي يحذف هذا الملف هو ما يُطلق البناء النظيف.
name: فك تعليق نشر Pages

on:
  push:
    paths: ['.github/workflows/pages-unstick.yml']
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: إلغاء النشر العالق
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUCK: ca70cdfb0fe08a43c63f31338732e32beab6cfd9
        run: |
          echo "حالة النشر العالق قبل الإلغاء:"
          gh api "repos/${{ github.repository }}/pages/deployments/$STUCK" || true
          echo "إرسال الإلغاء:"
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/$STUCK/cancel" -i | head -1
          sleep 5
          echo "الحالة بعد الإلغاء:"
          gh api "repos/${{ github.repository }}/pages/deployments/$STUCK" || true
