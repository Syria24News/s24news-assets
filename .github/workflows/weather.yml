# S24News — تحديث weather.json (حالة الطقس) آلياً
# يعمل أربع مرات يومياً، ويمكن تشغيله يدوياً من تبويب Actions ← «حالة الطقس» ← Run workflow.
# الكود في .github/scripts/weather.mjs — المصدر MET Norway (api.met.no).
# الاستهلاك: مجاني بالكامل (المستودع عام)، ولا يمس حصص Apps Script ولا Firestore.
# النشر: بعد الرفع تستدعي المهمة «نشر الموقع» (pages.yml) لأن رفعها بمفتاحها الافتراضي لا يطلق مهام أخرى.
# لا يُضاف هنا أي طلب بناء آخر: النشر كله يمر بطابور pages.yml الواحد.

name: حالة الطقس

on:
  schedule:
    # 23 دقيقة بعد الساعة (المواعيد الدقيقة على رأس الساعة مزدحمة في GitHub)
    # 00:23 و06:23 و12:23 و18:23 UTC = 03:23 و09:23 و15:23 و21:23 بتوقيت سوريا
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # حفظ weather.json في المستودع (النشر بعده عبر مهمة deploy أدناه)

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: جلب التوقعات وكتابة weather.json وweather-bar.json
        run: node .github/scripts/weather.mjs

      - name: حفظ الملف في المستودع
        run: |
          git config user.name  "s24-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if [ -f weather-bar.json ]; then git add weather-bar.json; fi
          if git diff --cached --quiet; then echo "لا تغيير"; exit 0; fi
          git commit -m "حالة الطقس: تحديث آلي"
          # Rates.gs ولوحة التحكم يكتبان في المستودع نفسه: دمج آخر نسخة قبل الرفع، مع إعادة المحاولة
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  # نشر الموقع بعد الرفع — عبر الطابور الواحد في pages.yml
  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
